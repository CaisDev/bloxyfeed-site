<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✍️ Escrever Notícia | BloxyFeed</title>
  <style>
    :root {
      --bg-body: #0f172a;
      --bg-card: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --radius: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.5;
      padding: 1rem;
    }

    header {
      max-width: 700px;
      margin: 1rem auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 { font-size: 1.5rem; }
    header a { color: var(--primary); text-decoration: none; font-size: 0.9rem; }

    .editor-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.5rem;
      max-width: 700px;
      margin: 1rem auto;
    }

    .form-group {
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-group label { font-weight: 600; font-size: 0.9rem; }

    .form-group input, .form-group select, .form-group textarea {
      padding: 0.75rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      background: var(--bg-body);
      color: var(--text-main);
      font-size: 0.95rem;
      width: 100%;
    }

    .form-group textarea { resize: vertical; min-height: 120px; }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .auth-box { text-align: center; padding: 2rem 1rem; }

    .user-info {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding: 0.75rem 1rem;
      background: var(--bg-body);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
    }

    .user-info img { width: 42px; height: 42px; border-radius: 50%; }
    footer { text-align: center; margin-top: 2rem; color: var(--text-muted); font-size: 0.85rem; }
  </style>
</head>
<body>

  <header>
    <h1>📰 BloxyFeed</h1>
    <nav><a href="index.html">← Voltar para o início</a></nav>
  </header>

  <main>
    <div class="editor-container">
      <div id="loadingSection" style="text-align: center; padding: 2rem;">
        <p style="color: var(--text-muted);">Verificando autenticação...</p>
      </div>

      <div id="authSection" class="auth-box" style="display: none;">
        <h2>🔒 Área de Autores</h2>
        <p style="margin: 1rem 0; color: var(--text-muted);">Faça login com sua conta do Google para publicar matérias.</p>
        <button id="btnLogin" type="button">Entrar com Google</button>
      </div>

      <div id="editorSection" style="display: none;">
        <div class="user-info">
          <img id="userPhoto" src="https://via.placeholder.com/40" alt="Foto" />
          <div>
            <strong id="userName">Autor</strong><br>
            <small style="color: var(--text-muted);" id="userEmail">email@exemplo.com</small>
          </div>
          <button id="btnLogout" type="button" style="margin-left: auto; padding: 0.4rem 0.8rem; font-size: 0.8rem; background: #ef4444;">Sair</button>
        </div>

        <h2>✍️ Nova Notícia</h2>
        <form id="formNoticia" style="margin-top: 1.5rem;">
          <div class="form-group">
            <label for="titulo">Título *</label>
            <input type="text" id="titulo" required placeholder="Digite o título..." />
          </div>

          <div class="form-group">
            <label for="categoria">Categoria *</label>
            <select id="categoria" required>
              <option value="Jogos">Jogos</option>
              <option value="Roblox">Roblox</option>
              <option value="Eventos">Eventos</option>
              <option value="Polêmica">Polêmica</option>
              <option value="Tendências">Tendências</option>
              <option value="Editores">Escolha do editor</option>
            </select>
          </div>

          <div class="form-group">
            <label for="imagemUrl">URL da Imagem de Capa</label>
            <input type="url" id="imagemUrl" placeholder="https://..." />
          </div>

          <div class="form-group">
            <label for="resumo">Resumo *</label>
            <textarea id="resumo" rows="2" required placeholder="Resumo para os cards..."></textarea>
          </div>

          <div class="form-group">
            <label for="conteudo">Conteúdo *</label>
            <textarea id="conteudo" rows="8" required placeholder="Texto da notícia..."></textarea>
          </div>

          <button type="submit" id="btnEnviar" style="width: 100%;">Publicar Notícia 🚀</button>
        </form>
      </div>
    </div>
  </main>

  <footer><p>© BloxyFeed</p></footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA3ymqYhh-2e4AwdehBi70oZ_-7TJeBU8k",
      authDomain: "autenticacao-f787f.firebaseapp.com",
      projectId: "autenticacao-f787f",
      storageBucket: "autenticacao-f787f.firebasestorage.app",
      messagingSenderId: "505467588693",
      appId: "1:505467588693:web:436509baaea84c566c44dc",
      measurementId: "G-H5NQ57NEZ0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // URL atualizada da sua API no Google Apps Script
    const API_URL = "https://script.google.com/macros/s/AKfycbw5rPfaxMkkS5PAYn536jHydt7_mtZp0uxx8m2cyg7pW_f7PTBnFDEAYQW8D_Vwmwl94A/exec";

    const loadingSection = document.getElementById("loadingSection");
    const authSection = document.getElementById("authSection");
    const editorSection = document.getElementById("editorSection");
    const btnLogin = document.getElementById("btnLogin");
    const btnLogout = document.getElementById("btnLogout");
    const formNoticia = document.getElementById("formNoticia");

    let currentUser = null;

    function updateUI(user) {
      loadingSection.style.display = "none";
      if (user) {
        currentUser = user;
        document.getElementById("userName").textContent = user.displayName || "Autor";
        document.getElementById("userEmail").textContent = user.email;
        document.getElementById("userPhoto").src = user.photoURL || "https://via.placeholder.com/40";
        authSection.style.display = "none";
        editorSection.style.display = "block";
      } else {
        currentUser = null;
        authSection.style.display = "block";
        editorSection.style.display = "none";
      }
    }

    onAuthStateChanged(auth, (user) => updateUI(user));

    setTimeout(() => {
      if (loadingSection.style.display !== "none") updateUI(auth.currentUser);
    }, 2500);

    btnLogin.onclick = async () => {
      try {
        btnLogin.disabled = true;
        btnLogin.textContent = "Aguardando...";
        const result = await signInWithPopup(auth, provider);
        updateUI(result.user);
      } catch (error) {
        alert("Erro no login: " + error.message);
      } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = "Entrar com Google";
      }
    };

    btnLogout.onclick = async () => {
      await signOut(auth);
      updateUI(null);
    };

    formNoticia.onsubmit = async (e) => {
      e.preventDefault();
      if (!currentUser) return alert("Sua sessão expirou.");

      const btnEnviar = document.getElementById("btnEnviar");
      btnEnviar.disabled = true;
      btnEnviar.textContent = "Publicando...";

      const payload = {
        titulo: document.getElementById("titulo").value,
        categoria: document.getElementById("categoria").value,
        imagemUrl: document.getElementById("imagemUrl").value,
        resumo: document.getElementById("resumo").value,
        conteudo: document.getElementById("conteudo").value,
        autor: currentUser.displayName || currentUser.email
      };

      try {
        await fetch(API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(payload)
        });

        alert("Notícia enviada com sucesso! 🚀");
        window.location.href = "index.html";
      } catch (err) {
        alert("Falha ao enviar notícia.");
      } finally {
        btnEnviar.disabled = false;
        btnEnviar.textContent = "Publicar Notícia 🚀";
      }
    };
  </script>
</body>
</html>
